name: Snowflake SQL Dev Deployment

on:
  push:
    paths:
      - 'sql/**'
  pull_request:
    paths:
      - 'sql/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate SQL Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint SQL files
        run: |
          echo "Running SQL validation..."
          # Only lint the actual SQL files, skip the setup file
          for sql_file in sql/[1-9]*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Validating $sql_file"
              sqlfluff lint "$sql_file" --dialect snowflake
            fi
          done

  deploy-dev:
    name: Deploy to DEV
    needs: validate
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Cache SnowSQL
        id: cache-snowsql
        uses: actions/cache@v3
        with:
          path: /usr/local/bin/snowsql
          key: snowsql-${{ runner.os }}-1.2.24

      - name: Install SnowSQL
        if: steps.cache-snowsql.outputs.cache-hit != 'true'
        env:
          SNOWSQL_VERSION: "1.2.24"
          SNOWSQL_SHA256: "e895d0a6483915ec1dbbf4943de6709ca0d034ad29785336ce83da61d85c9a88"
        run: |
          # Download and verify SnowSQL installer with retry logic
          for i in {1..3}; do
            curl -SL --retry 3 "https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/$SNOWSQL_VERSION/linux_x86_64/snowsql-linux_x86_64.bash" -o snowsql-linux_x86_64.bash && break
            sleep 5
          done
          
          # Verify checksum
          echo "$SNOWSQL_SHA256  snowsql-linux_x86_64.bash" | sha256sum -c -
          
          # Install SnowSQL
          chmod +x snowsql-linux_x86_64.bash
          SNOWSQL_DEST=/usr/local/bin SNOWSQL_LOGIN_SHELL=~/.profile ./snowsql-linux_x86_64.bash

      - name: Verify SnowSQL Installation
        run: |
          export PATH="/usr/local/bin:$PATH"
          snowsql --version

      - name: Configure and Deploy to DEV
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_ROLE: DEV_ROLE
          SNOWSQL_DB: DEV_DB
          SNOWSQL_WH: DEV_WH
          SNOWSQL_SCHEMA: PUBLIC
        run: |
          # Configure SnowSQL
          mkdir -p ~/.snowsql
          cat > ~/.snowsql/config << EOF
          [connections.dev]
          accountname = $SNOWSQL_ACCOUNT
          username = $SNOWSQL_USER
          password = $SNOWSQL_PWD
          rolename = $SNOWSQL_ROLE
          warehousename = $SNOWSQL_WH
          dbname = $SNOWSQL_DB
          EOF
          chmod 600 ~/.snowsql/config

          # Deploy SQL files
          echo "Executing SQL files..."
          for sql_file in sql/*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Executing $sql_file"
              snowsql -c dev -f "$sql_file" \
                --variable SNOWSQL_ENVVAR_ROLE=$SNOWSQL_ROLE \
                --variable SNOWSQL_ENVVAR_DB=$SNOWSQL_DB \
                --variable SNOWSQL_ENVVAR_WH=$SNOWSQL_WH \
                --variable SNOWSQL_ENVVAR_SCHEMA=$SNOWSQL_SCHEMA
            fi
          done
