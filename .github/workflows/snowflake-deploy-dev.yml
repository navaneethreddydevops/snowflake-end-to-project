name: Snowflake SQL Dev Deployment

on:
  push:
    paths:
      - 'sql/**'
  pull_request:
    paths:
      - 'sql/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate SQL Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint SQL files
        run: |
          echo "Running SQL validation..."
          # Only lint the actual SQL files, skip the setup file
          for sql_file in sql/[1-9]*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Validating $sql_file"
              sqlfluff lint "$sql_file" --dialect snowflake
            fi
          done

  deploy-dev:
    name: Deploy to DEV
    needs: validate
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v3

      # - name: Install OpenSSL dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y openssl libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install schemachange
        run: pip install schemachange

      - name: Create schemachange config directory
        run: mkdir -p .schemachange

      - name: Configure schemachange
        run: |
          cat > .schemachange/connections.toml << EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USERNAME }}"
          password = "${{ secrets.SNOWFLAKE_PASSWORD }}"
          role = "DEV_ROLE"
          warehouse = "DEV_WH"
          database = "DEV_DB"
          schema = "PUBLIC"
          EOF

      - name: Deploy to Snowflake
        run: |
          schemachange deploy \
            -f $GITHUB_WORKSPACE/sql \
            --create-change-history-table \
            -v \
            --vars '{"ROLE":"DEV_ROLE", "DATABASE":"DEV_DB", "WAREHOUSE":"DEV_WH", "SCHEMA":"PUBLIC"}'
          curl -L -o snowsql.rpm "https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.4/linux_x86_64/snowflake-snowsql-1.4.5-1.x86_64.rpm?_fsi=iRiJQI74"
          sudo alien -i snowsql.rpm
          export PATH=/usr/bin:$PATH

      - name: Configure and Deploy to DEV
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_ROLE: DEV_ROLE
          SNOWSQL_DB: DEV_DB
          SNOWSQL_WH: DEV_WH
          SNOWSQL_SCHEMA: PUBLIC
        run: |
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Step 1: Running schemachange"
          pip install sqlfluff schemachange
          # schemachange -f $GITHUB_WORKSPACE/sql -a $SNOWSQL_ACCOUNT -u $SNOWSQL_USER -r $SNOWSQL_ROLE -w $SNOWSQL_WH -d $SNOWSQL_DB -c $SNOWSQL_DB.SCHEMACHANGE.CHANGE_HISTORY --create-change-history-table

          # Configure SnowSQL
          echo "Step 2: Configuring SnowSQL"
          mkdir -p ~/.snowsql
          cat > ~/.snowsql/config << EOF
          [connections.dev]
          accountname = $SNOWSQL_ACCOUNT
          username = $SNOWSQL_USER
          password = $SNOWSQL_PWD
          rolename = $SNOWSQL_ROLE
          warehousename = $SNOWSQL_WH
          dbname = $SNOWSQL_DB
          EOF
          chmod 600 ~/.snowsql/config

          # Deploy SQL files
          echo "Executing SQL files..."
          for sql_file in sql/*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Executing $sql_file"
              snowsql -c dev -f "$sql_file" \
                --variable SNOWSQL_ENVVAR_ROLE=$SNOWSQL_ROLE \
                --variable SNOWSQL_ENVVAR_DB=$SNOWSQL_DB \
                --variable SNOWSQL_ENVVAR_WH=$SNOWSQL_WH \
                --variable SNOWSQL_ENVVAR_SCHEMA=$SNOWSQL_SCHEMA
            fi
          done
