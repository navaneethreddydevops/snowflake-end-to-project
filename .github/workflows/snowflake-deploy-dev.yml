name: Snowflake DEV Deployment

on:
  push:
    branches:
      - develop
    paths:
      - "ANALYTICS/**"
      - "REPORTING/**"
      - "FAMILYBUSINESS/**"
  pull_request:
    paths:
      - "ANALYTICS/**"
      - "REPORTING/**"
      - "FAMILYBUSINESS/**"
  workflow_dispatch:

jobs:
  validate:
    name: Validate SQL Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Lint SQL files
        run: |
          echo "Running SQL validation..."
          # Lint all SQL files in database folders
          find ANALYTICS REPORTING FAMILYBUSINESS -name "*.sql" -type f | while read sql_file; do
            echo "Validating $sql_file"
            sqlfluff lint "$sql_file" --dialect snowflake || echo "Warning: Linting issues in $sql_file"
          done

  deploy-databases:
    name: Deploy All Databases to DEV
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      matrix:
        database: [ANALYTICS, REPORTING, FAMILYBUSINESS]

    steps:
      - uses: actions/checkout@v3

      - name: Install SnowSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y alien
          curl -L -o snowsql.rpm "https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.4/linux_x86_64/snowflake-snowsql-1.4.5-1.x86_64.rpm?_fsi=iRiJQI74"
          sudo alien -i snowsql.rpm
          export PATH=/usr/bin:$PATH

      - name: Deploy ${{ matrix.database }} to DEV
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_ROLE: DEV_ROLE
          SNOWSQL_WH: DEV_WH
          DATABASE: ${{ matrix.database }}
        run: |
          # Configure SnowSQL
          mkdir -p ~/.snowsql
          cat > ~/.snowsql/config << EOF
          [connections.dev]
          accountname = $SNOWSQL_ACCOUNT
          username = $SNOWSQL_USER
          password = $SNOWSQL_PWD
          rolename = $SNOWSQL_ROLE
          warehousename = $SNOWSQL_WH
          dbname = ${DATABASE}_DEV
          EOF
          chmod 600 ~/.snowsql/config

          echo "Deploying $DATABASE database to DEV environment..."

          # Function to deploy SQL files
          deploy_sql_files() {
            local folder=$1
            local schema=${2:-$DATABASE}
            
            if [ -d "$DATABASE/$folder" ]; then
              echo "Deploying $folder objects for $DATABASE..."
              for sql_file in $DATABASE/$folder/*.sql; do
                if [ -f "$sql_file" ]; then
                  echo "Executing $sql_file"
                  snowsql -c dev -f "$sql_file" \
                    --variable SNOWSQL_ENVVAR_ROLE=$SNOWSQL_ROLE \
                    --variable SNOWSQL_ENVVAR_DB=${DATABASE}_DEV \
                    --variable SNOWSQL_ENVVAR_WH=$SNOWSQL_WH \
                    --variable SNOWSQL_ENVVAR_SCHEMA=$schema
                fi
              done
            fi
          }

          # Deploy based on database type
          if [ "$DATABASE" = "FAMILYBUSINESS" ]; then
            # Multi-schema deployment for FAMILYBUSINESS
            echo "Deploying FAMILYBUSINESS with multiple schemas..."
            
            # RAW schema
            deploy_sql_files "RAW/fileformats" "RAW"
            deploy_sql_files "RAW/stages" "RAW"
            deploy_sql_files "RAW/tables" "RAW"
            
            # STAGING schema  
            deploy_sql_files "STAGING/tables" "STAGING"
            deploy_sql_files "STAGING/procedures" "STAGING"
            deploy_sql_files "STAGING/tasks" "STAGING"
            
            # CURATED schema
            deploy_sql_files "CURATED/tables" "CURATED"
            deploy_sql_files "CURATED/procedures" "CURATED"
            deploy_sql_files "CURATED/views" "CURATED"
            deploy_sql_files "CURATED/tasks" "CURATED"
          else
            # Single schema deployment for ANALYTICS and REPORTING
            echo "Deploying $DATABASE with single schema..."
            deploy_sql_files "fileformats"
            deploy_sql_files "stages"
            deploy_sql_files "tables"
            deploy_sql_files "procedures"
            deploy_sql_files "views"
            deploy_sql_files "tasks"
          fi

          echo "$DATABASE deployment to DEV completed successfully!"
