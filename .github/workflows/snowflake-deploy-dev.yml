name: Snowflake SQL Dev Deployment

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v3

      - name: Install OpenSSL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libssl-dev

      - name: Install SnowSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y alien
          curl -L -o snowsql.rpm "https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.4/linux_x86_64/snowflake-snowsql-1.4.5-1.x86_64.rpm?_fsi=iRiJQI74"
          sudo alien -i snowsql.rpm
          export PATH=/usr/bin:$PATH

      - name: Configure and Deploy to DEV
        env:
          SF_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USER: ${{ secrets.SNOWFLAKE_USERNAME }}
          SF_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          # Configure SnowSQL
          mkdir -p ~/.snowsql
          cat > ~/.snowsql/config << EOF
          [connections.dev]
          accountname = $SF_ACCOUNT
          username = $SF_USER
          password = $SF_PASSWORD
          rolename = DEV_ROLE
          warehousename = DEV_WH
          dbname = DEV_DB
          EOF
          chmod 600 ~/.snowsql/config

          # Deploy SQL files
          export PATH=~/snowflake:$PATH
          for sql_file in sql/*.sql; do
            if [ -f "$sql_file" ]; then
              echo "Executing $sql_file"
              snowsql -c dev -f "$sql_file"
            fi
          done